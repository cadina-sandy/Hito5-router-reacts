name: Publicar en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar el proyecto
        uses: actions/checkout@v4
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Compilar el proyecto
        run: npm run build
      # Estas copias permiten abrir o recargar cada ruta en Pages.
      - name: Preparar las páginas
        run: |
          cp dist/index.html dist/404.html
          for route in register login cart pizza/p001 profile 404; do
            mkdir -p "dist/$route"
            cp dist/index.html "dist/$route/index.html"
          done
          touch dist/.nojekyll
      - name: Preparar Pages
        uses: actions/configure-pages@v5
      - name: Subir la compilación
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publicar el sitio
        id: deployment
        uses: actions/deploy-pages@v4
